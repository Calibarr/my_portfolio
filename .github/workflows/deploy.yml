name: Deploy Website to S3

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::328044701242:role/GitHubActions-S3-Portfolio
          aws-region: eu-west-1

      - name: Deploy website to S3
        run: aws s3 sync "Web Development/" s3://calum-portfolio-website --delete